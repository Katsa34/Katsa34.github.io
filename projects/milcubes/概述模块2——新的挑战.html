    (() => {
      let theme = "dark";
      try {
        const saved = localStorage.getItem("katsa34-theme");
        if (saved === "dark" || saved === "light") theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "light" ? "#f4eed8" : "#151614";
      document.querySelector('meta[name="color-scheme"]').content = theme;
    })();

    aria-label="切换到浅色模式" title="切换到浅色模式" hidden>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"></path>
    </svg>
    <span class="theme-toggle-label">浅色</span>
  </button><script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const label = toggle.querySelector(".theme-toggle-label");
      let isSwitching = false;

      function applyTheme(theme) {
        root.dataset.theme = theme;
        const isLight = theme === "light";
        const action = isLight ? "切换到深色模式" : "切换到浅色模式";
        label.textContent = isLight ? "深色" : "浅色";
        toggle.setAttribute("aria-label", action);
        toggle.title = action;
        document.querySelector('meta[name="theme-color"]').content =
          getComputedStyle(root).getPropertyValue("--page").trim();
        document.querySelector('meta[name="color-scheme"]').content = theme;
      }

      applyTheme(root.dataset.theme === "light" ? "light" : "dark");
      toggle.hidden = false;
      toggle.addEventListener("click", async () => {
        if (isSwitching) return;
        const theme = root.dataset.theme === "light" ? "dark" : "light";
        const update = () => {
          applyTheme(theme);
          try { localStorage.setItem("katsa34-theme", theme); } catch {}
        };

        if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) {
          update();
          return;
        }

        const rect = toggle.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const radius = Math.ceil(Math.hypot(
          Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)
        )) + 1;
        root.style.setProperty("--theme-origin-x", `${x}px`);
        root.style.setProperty("--theme-origin-y", `${y}px`);
        root.style.setProperty("--theme-radius", `${radius}px`);

        isSwitching = true;
        try {
          const transition = document.startViewTransition(update);
          transition.ready.catch(() => {});
          await transition.finished;
        } catch {
          update();
        } finally {
          isSwitching = false;
        }
      });
    })();
  </script></body></html>
